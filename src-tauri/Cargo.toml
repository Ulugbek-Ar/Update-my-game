[package]
name = "pikselqala"
version = "0.0.0"
description = "Piksel Qal'a — retro piksel RPG (Windows dasturi)"
edition = "2021"
publish = false

# Versiya src/game/version.ts dan olinadi (CI: tauri build --config '{"version": ...}').

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# kichikroq .exe (Telegram bot chegarasi 50 MB)
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
