name: Telegram post

on:
  push:
    branches: [main]
    paths: [src/game/version.ts]
  workflow_dispatch:
    inputs:
      test:
        description: "Faqat skrinshot (kanalga yubormaslik)"
        type: boolean
        default: false
      version:
        description: "Qaysi versiya ssenariysi (bo'sh = joriy)"
        required: false
      scenario:
        description: "Sinov uchun ssenariy JSON (bo'sh = fayldan)"
        required: false
      seed:
        description: "Bir martalik: avval chiqqan barcha versiyalarni belgilash (post yuborilmaydi)"
        type: boolean
        default: false
      wave:
        description: "Skrinshot to'lqini (0 = 1-to'lqin, 4 = Boss). Bo'sh = tasodifiy"
        required: false
      apk:
        description: "APK yuborish: eng oxirgi versiya APK'sini kanalga yuborish (post yuborilmaydi)"
        type: boolean
        default: false
      pc:
        description: "PC fayllarini yuborish: eng oxirgi versiya Windows (.exe) va portativ HTML arxivlarini kanalga yuborish (post yuborilmaydi)"
        type: boolean
        default: false

concurrency:
  group: telegram-post
  cancel-in-progress: false

jobs:
  post:
    if: ${{ !inputs.apk && !inputs.pc }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      posted: ${{ steps.posted.outputs.posted }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ inputs.seed && '0' || '1' }}

      - name: Avvalgi versiyalarni belgilash
        if: ${{ inputs.seed }}
        run: |
          for V in $(grep -oP 'version: "\K[^"]+' src/game/version.ts); do
            git ls-remote --exit-code --tags origin "refs/tags/tg-v$V" > /dev/null && continue
            C=$(git log --format=%H -S "GAME_VERSION = \"$V\"" --reverse -- src/game/version.ts | head -1)
            [ -z "$C" ] && continue
            git tag -f "tg-v$V" "$C" > /dev/null
            git push -qf origin "refs/tags/tg-v$V" 2> /dev/null || { git tag -f "tg-v$V" HEAD > /dev/null; git push -qf origin "refs/tags/tg-v$V"; }
            echo "tg-v$V"
          done

      - name: Bu versiya avval chiqqanmi?
        id: check
        run: |
          V="${{ inputs.version }}"
          [ -z "$V" ] && V=$(grep -oP 'GAME_VERSION\s*=\s*"\K[^"]+' src/game/version.ts)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          TAGS=$(git ls-remote --tags --refs origin 'tg-v*' | sed 's#.*refs/tags/##')
          PREV=$( (echo "$TAGS" | sed 's/^tg-v//'; echo "$V") | grep -v '^$' | sort -uV | grep -B1 -x "$V" | head -1)
          [ "$PREV" = "$V" ] && PREV="" || PREV="tg-v$PREV"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.seed }}" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && echo "$TAGS" | grep -qx "tg-v$V"; then
            echo "::notice title=Telegram::v$V avval kanalga chiqqan — qayta yuborilmaydi"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.check.outputs.skip != 'true'

      - uses: actions/setup-node@v5
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22

      - run: bun install --frozen-lockfile || bun install
        if: steps.check.outputs.skip != 'true'

      - name: O'yinni fonda ishga tushirish
        if: steps.check.outputs.skip != 'true'
        env:
          # Abadiyat olami multiplayer serveri (docs/server.md)
          VITE_SERVER_URL: https://pikselqala-server.ulugbek2647.workers.dev
        run: bun run dev -- --port 5173 --host 127.0.0.1 > dev.log 2>&1 &

      - name: Playwright paketi
        if: steps.check.outputs.skip != 'true'
        id: pw
        run: |
          npm i --prefix "$RUNNER_TEMP/pw" playwright@1 ffmpeg-static@5
          echo "version=$(node -p "require('$RUNNER_TEMP/pw/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: steps.check.outputs.skip != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: pw-ffmpeg-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Video yozuvchi (brauzer o'rnatilmaydi — serverdagi Chrome ishlatiladi)
        if: steps.check.outputs.skip != 'true'
        timeout-minutes: 3
        run: $RUNNER_TEMP/pw/node_modules/.bin/playwright install ffmpeg

      - name: O'yin tayyorligini kutish
        if: steps.check.outputs.skip != 'true'
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5173 > /dev/null && exit 0
            sleep 2
          done
          cat dev.log
          exit 1

      - name: Skrinshot
        if: steps.check.outputs.skip != 'true'
        env:
          SHOT_WAVE: ${{ inputs.wave }}
          SHOT_VERSION: ${{ inputs.version }}
          SHOT_SCENARIO: ${{ inputs.scenario }}
        run: |
          PW_DIR="$RUNNER_TEMP/pw" PW_CHANNEL=chrome node scripts/screenshot.mjs
          rm -rf shots/raw

      - uses: actions/upload-artifact@v5
        if: steps.check.outputs.skip != 'true'
        with:
          name: skrinshotlar
          path: shots/

      - name: Test rasmlarini preview branchga saqlash
        if: ${{ steps.check.outputs.skip != 'true' && inputs.test }}
        run: |
          cd shots
          git init -q -b skrinshot-preview
          git add .
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm preview
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" skrinshot-preview

      - name: Kanalga yuborish
        if: ${{ steps.check.outputs.skip != 'true' && !inputs.test }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GAME_URL_PUBLIC: ${{ vars.GAME_URL }}
          SHOT_VERSION: ${{ inputs.version }}
          PREV_TAG: ${{ steps.check.outputs.prev }}
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          V="${{ steps.check.outputs.version }}"
          if [ "$HAS_KEYSTORE" = "true" ] && echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.0$'; then export APK_COMING=true; fi
          if echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.0$'; then export PC_COMING=true; fi
          node --experimental-strip-types scripts/telegram-post.mjs

      - name: Versiyani "chiqdi" deb belgilash
        if: ${{ steps.check.outputs.skip != 'true' && !inputs.test }}
        run: |
          T="tg-v${{ steps.check.outputs.version }}"
          git tag -f "$T"
          git push -qf origin "refs/tags/$T"

      - name: Post kanalga chiqdi
        id: posted
        if: ${{ steps.check.outputs.skip != 'true' && !inputs.test }}
        run: echo "posted=true" >> "$GITHUB_OUTPUT"

  # ── Android APK kanalga ───────────────────────────────────────────────────────
  # x.y.0 versiya posti bilan birga (x.y.z, z > 0 — APK yo'q) yoki qo'lda "APK yuborish".
  # APK faqat doimiy keystore (secrets) bilan imzolanadi; secrets bo'lmasa yuborilmaydi —
  # debug imzoli APK ustidan keyingi versiyalar o'rnatilmay qoladi.
  apk-plan:
    needs: post
    if: ${{ !cancelled() && !inputs.seed && !inputs.test }}
    runs-on: ubuntu-latest
    outputs:
      send: ${{ steps.plan.outputs.send }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: APK yuboriladimi?
        id: plan
        env:
          MANUAL: ${{ inputs.apk }}
          POST_RESULT: ${{ needs.post.result }}
          POSTED: ${{ needs.post.outputs.posted }}
          POST_VERSION: ${{ needs.post.outputs.version }}
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          V=$(grep -oP 'GAME_VERSION\s*=\s*"\K[^"]+' src/game/version.ts)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          RELEASE=$(node --experimental-strip-types -e "import('./src/lib/apk.ts').then((m) => console.log(m.isApkRelease(process.argv[1])))" "$V")
          SEND=false
          if [ "$MANUAL" = "true" ]; then
            SEND=true
          elif [ "$POST_RESULT" = "success" ] && [ "$POSTED" = "true" ] && [ "$POST_VERSION" = "$V" ]; then
            if [ "$RELEASE" = "true" ]; then SEND=true; else echo "::notice title=APK::v$V — kichik tuzatish (x.y.z), APK yuborilmaydi"; fi
          fi
          if [ "$SEND" = "true" ] && [ "$HAS_KEYSTORE" != "true" ]; then
            echo "::warning title=APK::Imzo secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) topilmadi — APK kanalga yuborilmaydi. docs/apk.md ga qarang."
            SEND=false
          fi
          echo "send=$SEND" >> "$GITHUB_OUTPUT"
          echo "APK v$V yuboriladi: $SEND"

  apk-build:
    needs: apk-plan
    # !cancelled(): qo'lda "APK yuborish"da post o'tkazib yuboriladi — zanjir to'xtamasin
    if: ${{ !cancelled() && needs.apk-plan.outputs.send == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/android.yml
    with:
      skip_release: true
    secrets: inherit

  apk-send:
    needs: [apk-plan, apk-build]
    if: ${{ !cancelled() && needs.apk-build.result == 'success' && needs.apk-build.outputs.signed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/download-artifact@v5
        with:
          name: android-v${{ needs.apk-build.outputs.version }}
          path: apk/

      - name: APK'ni kanalga yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          APK_VERSION: ${{ needs.apk-build.outputs.version }}
          APK_FILE: apk/PikselQala-v${{ needs.apk-build.outputs.version }}.apk
        run: node --experimental-strip-types scripts/telegram-apk.mjs

  # ── Kompyuter (PC) fayllari kanalga ───────────────────────────────────────────
  # x.y.0 versiya posti bilan birga (APK'dan keyin) yoki qo'lda "PC fayllarini yuborish":
  # PikselQala-Windows.zip (o'rnatishsiz .exe) va PikselQala-portable.zip (bitta HTML).
  # 50 MB dan katta fayl o'rniga Release havolasi yuboriladi (scripts/telegram-pc.mjs).
  pc-plan:
    needs: post
    if: ${{ !cancelled() && !inputs.seed && !inputs.test && !inputs.apk }}
    runs-on: ubuntu-latest
    outputs:
      send: ${{ steps.plan.outputs.send }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: PC fayllari yuboriladimi?
        id: plan
        env:
          MANUAL: ${{ inputs.pc }}
          POST_RESULT: ${{ needs.post.result }}
          POSTED: ${{ needs.post.outputs.posted }}
          POST_VERSION: ${{ needs.post.outputs.version }}
        run: |
          V=$(grep -oP 'GAME_VERSION\s*=\s*"\K[^"]+' src/game/version.ts)
          RELEASE=$(node --experimental-strip-types -e "import('./src/lib/pcfiles.ts').then((m) => console.log(m.isPcRelease(process.argv[1])))" "$V")
          SEND=false
          if [ "$MANUAL" = "true" ]; then
            SEND=true
          elif [ "$POST_RESULT" = "success" ] && [ "$POSTED" = "true" ] && [ "$POST_VERSION" = "$V" ]; then
            if [ "$RELEASE" = "true" ]; then SEND=true; else echo "::notice title=PC::v$V — kichik tuzatish (x.y.z), PC fayllari yuborilmaydi"; fi
          fi
          echo "send=$SEND" >> "$GITHUB_OUTPUT"
          echo "PC fayllari v$V yuboriladi: $SEND"

  pc-build:
    needs: pc-plan
    if: ${{ !cancelled() && needs.pc-plan.outputs.send == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/windows.yml
    with:
      skip_release: true
    secrets: inherit

  pc-send:
    # APK (qadalgan post) avval chiqsin — apk-send tugashini kutadi (o'tkazib yuborilgan bo'lsa ham)
    needs: [pc-build, apk-send]
    if: ${{ !cancelled() && needs.pc-build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/download-artifact@v5
        with:
          name: windows-v${{ needs.pc-build.outputs.version }}
          path: pc/

      - name: PC fayllarini kanalga yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          PC_VERSION: ${{ needs.pc-build.outputs.version }}
          PC_DIR: pc
        run: node --experimental-strip-types scripts/telegram-pc.mjs
