name: Telegram post

on:
  push:
    branches: [main]
    paths: [src/game/version.ts]
  workflow_dispatch:
    inputs:
      test:
        description: "Faqat skrinshot (kanalga yubormaslik)"
        type: boolean
        default: false
      wave:
        description: "Skrinshot to'lqini (0 = 1-to'lqin, 5 = Boss). Bo'sh = tasodifiy"
        required: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile || bun install

      - name: Brauzer o'rnatish
        run: |
          npm i --prefix "$RUNNER_TEMP/pw" playwright@1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: O'yinni ishga tushirish
        run: |
          bun run dev -- --port 5173 --host 127.0.0.1 > dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5173 > /dev/null && exit 0
            sleep 2
          done
          cat dev.log
          exit 1

      - name: Skrinshot
        env:
          SHOT_WAVE: ${{ inputs.wave }}
        run: PW_DIR="$RUNNER_TEMP/pw" node scripts/screenshot.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: skrinshotlar
          path: |
            menu.png
            play.png

      - name: Kanalga yuborish
        if: ${{ !inputs.test }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GAME_URL_PUBLIC: ${{ vars.GAME_URL }}
        run: node --experimental-strip-types scripts/telegram-post.mjs
