name: Server

# Piksel Qal'a serveri (Cloudflare Workers + Durable Objects) deploy'i: Abadiyat olami multiplayer,
# akkauntlar, bulutli saqlanish, do'stlar va reyting. server/ yoki server ishlatadigan o'yin mantig'i
# o'zgarganda va qo'lda ishga tushirganda.
# Kerakli secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (docs/server.md),
# TELEGRAM_BOT_TOKEN — "Telegram bilan kirish" (docs/accounts.md): serverga `wrangler secret put`
# bilan beriladi va bot webhook'i o'rnatiladi (kanalga post yuborish bunga bog'liq emas, buzilmaydi).
# ADMIN_TELEGRAM_IDS — muallif paneli (docs/admin.md): Telegram ID'lar vergul bilan, serverga
# `wrangler secret put` bilan beriladi. Berilmasa yoki bo'sh bo'lsa — hech kim admin emas.
# Secrets bo'lmasa — ogohlantirish, workflow yiqilmaydi (faqat tekshiruv bajariladi).
on:
  push:
    branches: [main]
    paths:
      - server/**
      - src/realm/**
      - src/account/**
      - src/game/save.ts
      - src/game/progress.ts
      - src/game/achievements.ts
      - src/game/player.ts
      - src/game/animation.ts
      - src/game/hero.ts
      - src/game/version.ts
      - .github/workflows/server.yml
  workflow_dispatch:

concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Secrets bormi?
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Server::CLOUDFLARE_API_TOKEN yoki CLOUDFLARE_ACCOUNT_ID topilmadi — server deploy qilinmadi. docs/server.md ga qarang."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$BOT" ]; then
            echo "bot=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Bot::TELEGRAM_BOT_TOKEN topilmadi — \"Telegram bilan kirish\" o'chiq qoladi (o'yin mehmon rejimida ishlaydi). docs/accounts.md ga qarang."
            echo "bot=false" >> "$GITHUB_OUTPUT"
          fi

      # server o'yin kodini (src/realm) import qiladi — uning bog'liqliklari (zod) kerak
      - run: bun install --frozen-lockfile || bun install

      - run: npm ci
        working-directory: server

      - name: Tekshiruv (tsc va dry-run)
        working-directory: server
        run: |
          npx tsc --noEmit
          npx wrangler deploy --dry-run --outdir .wrangler/dry

      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.ok == 'true'
        working-directory: server
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -z "$URL" ] && URL="https://pikselqala-server.ulugbek2647.workers.dev"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # Bot tokeni faqat secret sifatida (kodda ham, wrangler.toml'da ham yo'q)
      - name: Bot tokeni serverga (wrangler secret put)
        if: steps.secrets.outputs.ok == 'true' && steps.secrets.outputs.bot == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN

      # Muallif(lar): faqat secret (kodda ham, wrangler.toml'da ham yo'q). Secret yo'q bo'lsa — "none"
      # yoziladi (ID emas): avval tayinlangan admin ham o'chadi, hech kim admin emas.
      - name: Muallif ID'lari serverga (wrangler secret put)
        if: steps.secrets.outputs.ok == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TELEGRAM_IDS: ${{ secrets.ADMIN_TELEGRAM_IDS }}
        run: |
          if [ -z "$ADMIN_TELEGRAM_IDS" ]; then
            echo "::warning title=Muallif::ADMIN_TELEGRAM_IDS bo'sh — muallif paneli hech kimga ochilmaydi (docs/admin.md)"
          fi
          printf '%s' "${ADMIN_TELEGRAM_IDS:-none}" | npx wrangler secret put ADMIN_TELEGRAM_IDS

      # Bot -> server: "/start login_<kod>" va "Tasdiqlash" tugmasi shu yerga keladi. Yo'l va
      # X-Telegram-Bot-Api-Secret-Token tokendan yasaladi (src/account/server/telegram.ts webhookSecret).
      # setWebhook faqat kiruvchi xabarlarni o'zgartiradi: kanalga sendMessage/sendPhoto ishlayveradi.
      - name: Bot webhook'i
        if: steps.secrets.outputs.ok == 'true' && steps.secrets.outputs.bot == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          SECRET=$(printf 'pikselqala-webhook:%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-40)
          echo "::add-mask::$SECRET"
          R=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${URL}/tg/${SECRET}" \
            --data-urlencode "secret_token=${SECRET}" \
            --data-urlencode 'allowed_updates=["message","callback_query"]' \
            --data-urlencode "drop_pending_updates=true")
          if echo "$R" | grep -q '"ok":true'; then
            echo "::notice title=Bot::webhook o'rnatildi — Telegram bilan kirish ishlaydi"
          else
            echo "::warning title=Bot::setWebhook javobi: $(echo "$R" | sed "s/$SECRET/***/g")"
          fi
          I=$(curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const r=JSON.parse(s).result||{};console.log('kutilayotgan: '+(r.pending_update_count??'?')+(r.last_error_message?', oxirgi xato: '+r.last_error_message:''))}catch{console.log('javob yo\'q')}})")
          echo "Bot webhook: $I"
          echo "- Bot webhook: $I" >> "$GITHUB_STEP_SUMMARY"

      - name: Server manzili va /health
        if: steps.secrets.outputs.ok == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          H=""
          for i in 1 2 3 4 5 6; do
            H=$(curl -sf "$URL/health") && break
            sleep 5
          done
          [ -z "$H" ] && H="javob yo'q"
          echo "Server: $URL"
          echo "/health: $H"
          echo "::notice title=Server::$URL — $H"
          {
            echo "### Piksel Qal'a serveri"
            echo "- Manzil: $URL"
            echo "- /health: \`$H\`"
          } >> "$GITHUB_STEP_SUMMARY"
