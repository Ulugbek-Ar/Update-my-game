name: GitHub Pages

# Har bir main'ga push'da o'yinning statik versiyasi yig'iladi va gh-pages
# branchiga joylanadi: https://ulugbek-ar.github.io/Update-my-game/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile || bun install
      - name: Statik build
        run: bun run build
        env:
          GH_PAGES: "1"
      - name: SPA uchun 404 sahifa
        run: |
          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/client
          publish_branch: gh-pages
          force_orphan: true
